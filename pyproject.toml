[project]
name = "promptodys"
version = "1.3.0b2"
description = "PromptoDYS - éditeur de texte pour utilisateurs dyslexiques, propulsé par Gemini"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "eel>=0.18,<0.19",
    "google-genai>=2.29,<3",
    "reportlab>=5.0,<6",
    "sv-ttk>=2.6,<3",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyinstaller>=6",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
# Toujours utiliser le Python géré par uv (inclut Tkinter), jamais celui du système ou de Homebrew
python-preference = "only-managed"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# F : erreurs (noms non définis, imports inutilisés), E/W : pycodestyle,
# B : bugs probables (flake8-bugbear), UP : syntaxe Python moderne, SIM : simplifications
select = ["F", "E", "W", "B", "UP", "SIM"]

[tool.ruff.format]
# CONTRIBUTING.md montre un exemple volontairement mal formaté (« ❌ MAUVAIS »)
exclude = ["CONTRIBUTING.md"]

[tool.importlinter]
root_package = "promptodys"
# Nécessaire pour interdire des bibliothèques (tkinter, eel, google, reportlab), pas seulement nos couches
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain n'importe aucune autre couche ni bibliothèque d'interface ou d'infrastructure"
type = "forbidden"
source_modules = ["promptodys.domain"]
# google et non google.genai : import-linter regroupe les paquets externes sous leur nom de premier niveau
forbidden_modules = [
    "promptodys.infrastructure",
    "promptodys.presentation",
    "tkinter",
    "sv_ttk",
    "eel",
    "google",
    "reportlab",
]

[[tool.importlinter.contracts]]
name = "presentation n'importe ni infrastructure ni les bibliothèques techniques"
type = "forbidden"
source_modules = ["promptodys.presentation"]
forbidden_modules = ["promptodys.infrastructure", "eel", "google", "reportlab"]

[[tool.importlinter.contracts]]
name = "infrastructure n'importe pas presentation"
type = "forbidden"
source_modules = ["promptodys.infrastructure"]
forbidden_modules = ["promptodys.presentation"]

[[tool.importlinter.contracts]]
name = "aucune couche n'importe l'assemblage (promptodys.app)"
type = "forbidden"
source_modules = ["promptodys.domain", "promptodys.infrastructure", "promptodys.presentation"]
forbidden_modules = ["promptodys.app"]

[tool.pyright]
# Le paquet seulement : askGeminiPrompto.py (simple enveloppe de promptodys.app.main) et les tests ne sont pas annotés.
# Lancé par uv run, qui active .venv : pyright y trouve l'interpréteur et les bibliothèques.
include = ["promptodys"]
typeCheckingMode = "standard"
# Le domaine est entièrement annoté et n'utilise aucune bibliothèque tierce
strict = ["promptodys/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rend askGeminiPrompto.py (à la racine) importable depuis tests/
pythonpath = ["."]
# Un test qui boucle échoue au bout de 10 s au lieu de figer pytest (pytest-timeout)
timeout = 10
