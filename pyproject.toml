[project]
name = "promptodys"
version = "1.3.0b2"
description = "PromptoDYS - éditeur de texte pour utilisateurs dyslexiques, propulsé par Gemini"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "eel>=0.18,<0.19",
    "google-genai>=2.29,<3",
    "reportlab>=5.0,<6",
    "sv-ttk>=2.6,<3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[tool.uv]
package = false
# Toujours utiliser le Python géré par uv (inclut Tkinter), jamais celui du système ou de Homebrew
python-preference = "only-managed"
