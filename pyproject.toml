[project]
name = "promptodys"
version = "1.3.0b2"
description = "PromptoDYS - éditeur de texte pour utilisateurs dyslexiques, propulsé par Gemini"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "eel>=0.18,<0.19",
    "google-genai>=2.29,<3",
    "reportlab>=5.0,<6",
    "sv-ttk>=2.6,<3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
# Toujours utiliser le Python géré par uv (inclut Tkinter), jamais celui du système ou de Homebrew
python-preference = "only-managed"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# F : erreurs (noms non définis, imports inutilisés), E/W : pycodestyle,
# B : bugs probables (flake8-bugbear), UP : syntaxe Python moderne, SIM : simplifications
select = ["F", "E", "W", "B", "UP", "SIM"]
